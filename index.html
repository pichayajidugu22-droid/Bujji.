(function(){var cu,sc;String.raw`@kinematics|projectile|equations of motion|uniform acceleration::Kinematics
#Straight-line motion
First equation|v=u+at|Constant acceleration; u is initial and v final velocity.
Displacement|s=ut+\tfrac{1}{2}at^{2}|Use signs for direction.
Velocity-displacement|v^{2}=u^{2}+2as|Handy when time is not given.
Distance in nth second|s_n=u+\tfrac{a}{2}(2n-1)|Only that one second.
#Projectile
Range|R=\frac{u^{2}\sin 2\theta}{g}|Maximum at 45 degrees.
Maximum height|H=\frac{u^{2}\sin^{2}\theta}{2g}|Uses the vertical component only.
Time of flight|T=\frac{2u\sin\theta}{g}|Level ground.
@newton|work-energy|work done|kinetic energy|friction|momentum|collision::Laws of Motion, Work and Energy
#Laws and friction
Newton second law|F=ma|Net force; a vector equation.
Limiting friction|f_{max}=\mu N|Kinetic friction uses the kinetic coefficient.
Incline acceleration|a=g(\sin\theta-\mu\cos\theta)|Sliding down a rough incline.
Momentum|p=mv|Conserved when no external force acts.
#Work, energy, power
Work|W=Fs\cos\theta|Dot product of force and displacement.
Kinetic energy|K=\tfrac{1}{2}mv^{2}|Work-energy theorem: W equals change in K.
Spring energy|U=\tfrac{1}{2}kx^{2}|Spring stretched by x.
Power|P=\frac{W}{t}=Fv|Average and instantaneous.
Restitution|e=\frac{v_2-v_1}{u_1-u_2}|e=1 elastic, e=0 perfectly inelastic.
@rotation|rotational|torque|moment of inertia|angular momentum::Rotational Motion
#Key relations
Torque|\tau=I\alpha|About a fixed axis.
Angular momentum|L=I\omega|Conserved when net torque is zero.
Rolling kinetic energy|K=\tfrac{1}{2}mv^{2}\left(1+\frac{k^{2}}{R^{2}}\right)|k is the radius of gyration.
Parallel axis theorem|I=I_{cm}+Md^{2}|Axis parallel to the one through the centre.
Solid sphere|I=\tfrac{2}{5}MR^{2}|About a diameter. Ring is MR squared, disc is half of that.
@shm|oscillation|simple harmonic|pendulum::Simple Harmonic Motion
#SHM
Displacement|x=A\sin(\omega t+\phi)|Amplitude A, angular frequency omega.
Condition|a=-\omega^{2}x|Acceleration proportional to displacement, opposite in direction.
Spring period|T=2\pi\sqrt{\frac{m}{k}}|Independent of amplitude.
Pendulum period|T=2\pi\sqrt{\frac{L}{g}}|Small angles only.
Velocity|v=\omega\sqrt{A^{2}-x^{2}}|Maximum A times omega at the mean position.
Total energy|E=\tfrac{1}{2}m\omega^{2}A^{2}|Constant.
@electrostat|coulomb|electric field|capacitor|gauss::Electrostatics
#Fields and potential
Coulomb law|F=\frac{1}{4\pi\varepsilon_0}\frac{q_1q_2}{r^{2}}|Along the line joining the charges.
Point charge field|E=\frac{kq}{r^{2}}|k is 9 times 10 to the 9.
Potential|V=\frac{kq}{r}|Scalar; add algebraically.
Gauss law|\oint \vec E\cdot d\vec A=\frac{q_{enc}}{\varepsilon_0}|Choose a symmetric surface.
#Capacitors
Parallel plate|C=\frac{\varepsilon_0 A}{d}|Capacitance.
Energy stored|U=\tfrac{1}{2}CV^{2}|Equal to Q squared over 2C.
Series|\frac{1}{C}=\frac{1}{C_1}+\frac{1}{C_2}|In parallel the capacitances add.
@current electricity|ohm|kirchhoff|wheatstone|resistivity::Current Electricity
#Circuits
Ohm law|V=IR|For ohmic conductors.
Resistance|R=\rho\frac{l}{A}|Depends on material and temperature.
Power|P=VI=I^{2}R|Heat in a resistor.
Cell with internal resistance|V=\varepsilon-Ir|Terminal voltage.
Kirchhoff rules|\sum I=0,\ \sum V=0|Junction rule and loop rule.
Wheatstone balance|\frac{P}{Q}=\frac{R}{S}|No galvanometer current.
@thermodynamic|ideal gas|gas law|carnot|kinetic theory|entropy::Thermodynamics
#Gases and laws
Ideal gas|PV=nRT|R is 8.314 joule per mole kelvin.
First law|\Delta U=Q-W|W is work done by the gas.
Isothermal work|W=nRT\ln\frac{V_2}{V_1}|Change in internal energy is zero.
Adiabatic|PV^{\gamma}=\text{constant}|Gamma is Cp over Cv.
Carnot efficiency|\eta=1-\frac{T_2}{T_1}|Temperatures in kelvin.
RMS speed|v_{rms}=\sqrt{\frac{3RT}{M}}|Kinetic theory.
@optics|lens|mirror|refraction|snell|interference|young::Ray and Wave Optics
#Optics
Mirror formula|\frac{1}{v}+\frac{1}{u}=\frac{1}{f}|Apply sign convention; f is R by 2.
Lens formula|\frac{1}{v}-\frac{1}{u}=\frac{1}{f}|Cartesian sign convention.
Snell law|n_1\sin i=n_2\sin r|Refraction at a surface.
Lens maker|\frac{1}{f}=(n-1)\left(\frac{1}{R_1}-\frac{1}{R_2}\right)|Lens in air.

@mole concept|\bmoles?\b|stoichiometry|molarity|molality::Mole Concept
#Concentration
Moles|n=\frac{m}{M}=\frac{N}{N_A}|Avogadro number is 6.022 times 10 to the 23.
Molarity|M=\frac{n_{solute}}{V_{L}}|Moles per litre of solution.
Molality|m=\frac{n_{solute}}{kg_{solvent}}|Independent of temperature.
Mole fraction|\chi_A=\frac{n_A}{n_A+n_B}|All fractions add to 1.
Dilution|M_1V_1=M_2V_2|Moles stay the same.
@equilibrium|le chatelier|\bkp\b|\bkc\b|buffer|ph value::Chemical and Ionic Equilibrium
#Equilibrium
Kc|K_c=\frac{[C]^{c}[D]^{d}}{[A]^{a}[B]^{b}}|Equilibrium concentrations.
Kp and Kc|K_p=K_c(RT)^{\Delta n}|Delta n is gaseous moles of products minus reactants.
Reaction quotient|Q<K\Rightarrow\text{forward}|If Q is greater than K the reaction goes backward.

Henderson|pH=pK_a+\log\frac{[A^-]}{[HA]}|Buffer solutions.

#Quadratics

var STOP=/^(stop|quiet|silence|shut up|enough|cancel|ruko|bas|चुप|रुको|बस|ఆపు|ఆపండి|நிறுத்து|நிறுத்துங்கள்|ನಿಲ್ಲಿಸು|നിർത്തൂ|থামো|থামুন|para|arrête|stopp)$/i;
var LANGS=[["","Auto"],["en","English"],["hi","हिन्दी"],["te","తెలుగు"],["ta","தமிழ்"],["kn","ಕನ್ನಡ"],["ml","മലയാളം"],["bn","বাংলা"],["mr","मराठी"],["gu","ગુજરાતી"],["pa","ਪੰਜਾਬੀ"],["ur","اردو"],["es","Español"],["fr","Français"],["de","Deutsch"],["pt","Português"],["it","Italiano"],["ru","Русский"],["zh","中文"],["ja","日本語"],["ko","한국어"],["ar","العربية"],["tr","Türkçe"],["id","Indonesia"],["th","ไทย"],["vi","Tiếng Việt"],["nl","Nederlands"]];
var sel=document.getElementById("lang");
LANGS.forEach(function(l){var o=document.createElement("option");o.value=l[0];o.textContent=l[1];sel.appendChild(o)});
sel.value=LANG;
["pointerdown","keydown"].forEach(function(ev){sel.addEventListener(ev,function(e){e.stopPropagation()})});
function langOpt(){return LANG?{language:LANG}:undefined}
function go(){dict.start(langOpt()).then(function(){retry=0;if(!warmed){warmed=true;warm()}}).catch(needTouch)}
sel.addEventListener("change",function(){
  LANG=sel.value;try{localStorage.setItem("jl",LANG)}catch(e){}
  say(LANG?"Language set. Speak now.":"Language: automatic.",1);
  if(dict){try{if(dict.active())dict.stop().catch(function(){});go()}catch(e){needTouch(e)}}
  else if(rec){try{rec.stop()}catch(e){}}
});
function hear(tx,fin){
  tx=(tx||"").trim();if(!tx)return;
  if(speaking||Date.now()<qu){
    var z=tx.toLowerCase().replace(/[.!?,।]/g,"").trim();
    if(z.split(" ").length<=4&&isStop(z)){stopTalk();buf="";clearTimeout(bt);say("Stopped.",1);return}
    if(echo(tx)&&!WAKE.test(tx))return;
    if(!fin){if(speaking&&z.split(" ").length>=2){stopTalk();say(tx,1)}return}
  }
  if(!fin){if(!busy)say((buf+" "+tx).trim(),1);return}
  buf=(buf+" "+tx).trim();clearTimeout(bt);
  bt=setTimeout(function(){var s=buf;buf="";heard(s)},450)
}
function needTouch(e){
  var c=e&&e.code;
  if(c==="not_granted")say("Dictation access was declined. Allow it in this page’s Permissions menu, then touch the screen.",1);
  else if(c==="unavailable"&&LANG){LANG="";sel.value="";say("That language isn’t available for voice input here. Switched to automatic. Touch the screen.",1)}
  else if(c==="unavailable")say("Voice input isn’t available in this view. Open the link in desktop Chrome.",1);
  else if(c==="rate_limited")say("The microphone is busy. Touch the screen to try again.",1);
  else say("Touch the screen once to start listening.",1)
}
function begin(){
  if(!dict||dict.active())return;
  try{go()}catch(e){needTouch(e)}
}
function gesture(){
  if(!unlocked){unlocked=true;try{var u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}catch(e){}}
  begin()
}
["pointerdown","keydown","touchstart","click"].forEach(function(ev){addEventListener(ev,gesture)});
function initVoice(){
  var p=window.claude?useCap("dictation"):Promise.resolve(null);
  p.then(function(d){
    if(!d){if(SR)listen();else say("Voice input isn’t available in this view. Open the link in desktop Chrome.",1);return}
    dict=d;setTimeout(begin,300);
    d.onPartial(function(e){hear(e.text,false)});
    d.onFinal(function(e){hear(e.text,true)});
    d.onState(function(e){
      live=e.state==="listening"||e.state==="starting";
      if(e.state==="listening"){if(!busy&&!speaking)say("Listening. Speak in any language.",1)}
      else if(e.state==="idle"&&e.reason){
        var r=e.reason;
        if(r==="not_granted")say("Dictation access was declined. Allow it in this page’s Permissions menu.",1);
        else if(r==="viewer_stopped")say("Touch the screen to resume listening.",1);
        else if(r!=="stopped"&&r!=="hidden"&&r!=="unavailable"){setTimeout(begin,Math.min(1000*(++retry),8000))}
      }
    });
    say("Touch the screen once to start listening.",1)
  }).catch(function(){say("Voice input isn’t available in this view.",1)})
}

document.addEventListener("visibilitychange",function(){if(!document.hidden)begin()});
setInterval(function(){if(dict&&!dict.active()&&!document.hidden){try{dict.start(langOpt()).catch(function(){})}catch(e){}}},4000);
var tx=document.getElementById("tx");
["pointerdown","keydown"].forEach(function(ev){tx.addEventListener(ev,function(e){e.stopPropagation()})});
tx.addEventListener("keydown",function(e){
  if(e.key!=="Enter")return;var v=tx.value.trim();if(!v)return;tx.value="";
  gesture();stopTalk();act(v)
});

/* keep the screen awake and the mic alive */
function lock(){try{navigator.wakeLock.request("screen").catch(function(){})}catch(e){}}
document.addEventListener("visibilitychange",function(){if(!document.hidden){lock();if(micOK&&rec)start()}});
lock();

/* ask for AI consent once, early, so it never interrupts a conversation */
function warm(){
  try{if(window.claude)useCap("sample").then(function(s){sample=s;if(s)s("Reply with the single word OK.",{modelTier:"quick"}).catch(function(){})}).catch(function(){})}catch(e){}
}

/* ---------- animation ---------- */
function frame(now){
  var t=(now-t0)/1000,i,a,x,y,rr;
  state=busy&&!speaking?"think":speaking?"speak":live?"listen":"idle";
  var tg=COL[state];for(i=0;i<3;i++)cur[i]+=(tg[i]-cur[i])*.06;
  var tl=state==="speak"?.5+.35*Math.sin(t*8)*Math.sin(t*3.7):state==="listen"?.28:state==="think"?.4:.08;
  lvl+=(tl-lvl)*.08;bump*=.85;
  var L=Math.max(0,lvl+bump),k=state==="think"?3.2:state==="idle"?.6:1;
  mix+=(sheetOn-mix)*.08;var cx=W/2,cy=H*(.42-.24*mix),R=Math.min(W*.9,H*.7)*(.3-.13*mix);
  g.clearRect(0,0,W,H);
  var rg=g.createRadialGradient(cx,cy,0,cx,cy,R*1.1);
  rg.addColorStop(0,rgba(.55+L*.3));rg.addColorStop(.3,rgba(.16+L*.14));rg.addColorStop(1,rgba(0));
  g.fillStyle=rg;g.beginPath();g.arc(cx,cy,R*1.1,0,6.283);g.fill();
  g.shadowColor=rgba(.9);g.shadowBlur=12;g.strokeStyle=rgba(.9);g.fillStyle=rgba(.9);
  g.lineWidth=1.2;g.setLineDash([]);
  var rot=t*.12*k,r0=R*1.3;
  for(i=0;i<72;i++){
    a=rot+i*6.283/72;var l=i%6?R*.04:R*.09;
    g.beginPath();g.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);g.lineTo(cx+Math.cos(a)*(r0+l),cy+Math.sin(a)*(r0+l));g.stroke()
  }
  g.lineWidth=3.5;
  for(i=0;i<6;i++){a=-t*.3*k+i*1.0472;g.beginPath();g.arc(cx,cy,R*1.12,a,a+.72);g.stroke()}
  g.lineWidth=1.4;g.setLineDash([2,9]);g.beginPath();g.arc(cx,cy,R*.95,t*.5*k,t*.5*k+6.283);g.stroke();g.setLineDash([]);
  g.lineWidth=2;g.beginPath();g.arc(cx,cy,R*.86,t*.4*k,t*.4*k+4.2);g.stroke();
  var amp=R*.05*(.4+L*2);g.beginPath();
  for(i=0;i<=120;i++){
    a=i*6.283/120;rr=R*.68+amp*(Math.sin(a*7+t*3*k)+.6*Math.sin(a*13-t*4.1*k));
    x=cx+Math.cos(a)*rr;y=cy+Math.sin(a)*rr;i?g.lineTo(x,y):g.moveTo(x,y)
  }
  g.closePath();g.stroke();
  g.lineWidth=1.6;g.beginPath();
  for(i=0;i<3;i++){
    a=-t*.6*k+i*2.0944;rr=R*(.36+L*.05);x=cx+Math.cos(a)*rr;y=cy+Math.sin(a)*rr;i?g.lineTo(x,y):g.moveTo(x,y)
  }
  g.closePath();g.stroke();
  g.beginPath();g.arc(cx,cy,R*(.09+L*.05),0,6.283);g.fill();
  g.shadowBlur=0;
  for(i=0;i<P.length;i++){
    var p=P[i],f=(p.r+t*p.s*(.05+L*.4))%1,rp=R*(.45+f*1.1);a=p.a+t*.04*k;
    g.globalAlpha=(1-f)*.8;g.beginPath();g.arc(cx+Math.cos(a)*rp,cy+Math.sin(a)*rp,1.6,0,6.283);g.fill()
  }
  g.globalAlpha=1;
  requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
initVoice();
})();
</script>
